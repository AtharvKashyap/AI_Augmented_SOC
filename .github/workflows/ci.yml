# GitHub Actions workflow: CI
#
# Purpose:
#   Runs linting, unit tests, and a replay CLI smoke test on Linux, macOS, and Windows.
#
# What it checks:
#   - Dependencies install successfully
#   - Ruff linting passes, against the rule set pinned in ruff.toml using the
#     Ruff version pinned in requirements.txt. Both are pinned deliberately: an
#     unpinned linter turns any upstream release into a red build.
#   - Unit tests pass with pytest
#   - Triage quality still meets the labeled-set thresholds
#   - The replay-driven pipeline CLI runs successfully
#   - A report artifact can be generated from sample replay data
#
# Notes:
#   This workflow avoids live Wazuh, Security Onion, OpenRouter, SMTP, and Slack
#   dependencies. It only validates the local replay-driven MVP path.
#
#   The evaluation step runs the LOCAL half of the triage evaluation only, so it
#   needs no API key. The LLM half is opt-in via `run_eval.py --llm` and is not
#   run here. Note that the shipped labels are synthetic, so a passing step means
#   local triage is self-consistent with our stated expectations, not that triage
#   accuracy has been validated against analyst judgment.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linting
        run: |
          ruff check soc tests run_pipeline.py run_review.py run_eval.py run_report.py run_assistant.py run_response.py

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Evaluate triage against the labeled set
        shell: bash
        run: python run_eval.py --fail-under-thresholds --pretty

      - name: Run replay CLI smoke test
        shell: bash
        run: python run_pipeline.py --replay tests/fixtures/sample_incident_replay.json --db data/soc.db --output output --no-dedup --pretty

      - name: Upload generated report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            output/
            data/soc.db
          if-no-files-found: ignore