# GitHub Actions workflow: CI
#
# Purpose:
#   Runs the Python test suite on every push and pull request.
#
# What it checks:
#   - Dependencies install successfully
#   - Unit tests pass with pytest
#
# Notes:
#   This workflow is intentionally small for the MVP. As the project grows,
#   add coverage reporting, integration tests, and fixture replay tests here.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v