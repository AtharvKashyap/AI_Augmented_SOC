# GitHub Actions workflow: Secret scan
#
# Purpose:
#   Runs Gitleaks to detect accidentally committed secrets.
#
# What it checks:
#   - API keys
#   - Passwords
#   - Tokens
#   - Private keys
#
# Notes:
#   This is especially important because this project uses `.env` files,
#   OpenRouter keys, Wazuh credentials, Security Onion credentials, and
#   optional threat-intel API keys.

name: Secret Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}