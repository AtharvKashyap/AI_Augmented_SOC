# GitHub Actions workflow: Lint
#
# Purpose:
#   Runs Ruff to catch style issues, unused imports, syntax problems,
#   and simple formatting problems.
#
# What it checks:
#   - Python linting with Ruff
#   - Basic code quality before merge
#
# Notes:
#   Ruff is fast and works well for small Python projects. Formatting can
#   later be enforced with `ruff format --check`.

name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check .